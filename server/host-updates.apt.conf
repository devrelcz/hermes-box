// Installed by ./install.sh as /etc/apt/apt.conf.d/52hobcrew-box-updates when
// instance/.env has HOST_AUTO_UPDATES=true, and removed again without it.
//
// unattended-upgrades installs Ubuntu's or Debian's security updates as the
// distribution set it up (50unattended-upgrades); this adds Docker's own
// repository, a reboot when an update needs one, and the cleanup after it.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Origins-Pattern {
	"origin=Docker,label=Docker CE";
};
// Right after the nightly run (hobcrew-box's drop-in for
// apt-daily-upgrade.timer sets its time), signed-in users or not.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "now";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
