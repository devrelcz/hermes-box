# Installed by ./install.sh as
# /etc/systemd/system/apt-daily-upgrade.service.d/hobcrew-box.conf when
# instance/.env has HOST_AUTO_UPDATES=true.
#
# No system update (and no reboot) while update.sh or a deployment is in the
# middle of its work; tonight's run is skipped and tomorrow's catches up. A
# marker older than 45 minutes is left over and does not count, as in
# monitor/hermes-monitor.sh.

[Service]
ExecCondition=/bin/sh -c 'test -z "$$(find /run/hermes-deploying -mmin -45 2>/dev/null)"'
