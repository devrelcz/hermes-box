# Installed by ./install.sh as
# /etc/systemd/system/apt-daily-upgrade.timer.d/hobcrew-box.conf when
# instance/.env has HOST_AUTO_UPDATES=true.
#
# The system's updates run at night instead of about 06:00: an update of
# Docker restarts the stack, and a new kernel reboots the server right after.
# 04:15 UTC is after the backup (02:30 UTC) and before the morning cron jobs.

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:15:00 UTC
RandomizedDelaySec=15min
